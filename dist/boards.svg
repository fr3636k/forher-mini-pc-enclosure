<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920"><rect width="1200" height="920" fill="#fff" /><g font-family="Microsoft JhengHei,sans-serif"><text x="45" y="48" font-size="26" fill="#7a2cb0">豐禾｜超音波錄影盒 — 板件示意 V4</text><text x="45" y="78" font-size="15">外尺寸 220 × 220 × 100 mm；板厚 9 mm；每片 1 件；圖示非 1:1 列印比例。</text><g transform="translate(15,100) scale(1.18)"><text x="40" y="20" font-size="12" fill="#7a2cb0">A / 上板　220 × 220 × 9 mm</text><rect x="40" y="35" width="220" height="220" fill="#d9b789" stroke="#795f41" stroke-width="1.2" /><text x="150.0" y="273" text-anchor="middle" font-size="11" fill="#5c436e">220 mm</text><text x="29" y="145.0" text-anchor="middle" font-size="10" fill="#5c436e" transform="rotate(-90 29 145.0)">220 mm</text><text x="40" y="289" font-size="9" fill="#6d6478">可拆上蓋，方便檢修。</text><text x="40" y="304" font-size="9" fill="#6d6478" /></g><g transform="translate(405,100) scale(1.18)"><text x="40" y="20" font-size="12" fill="#7a2cb0">B / 底板　220 × 220 × 9 mm</text><rect x="40" y="35" width="220" height="220" fill="#d9b789" stroke="#795f41" stroke-width="1.2" /><text x="150.0" y="273" text-anchor="middle" font-size="11" fill="#5c436e">220 mm</text><text x="29" y="145.0" text-anchor="middle" font-size="10" fill="#5c436e" transform="rotate(-90 29 145.0)">220 mm</text><text x="40" y="289" font-size="9" fill="#6d6478">承托主機，固定盒內設備。</text><text x="40" y="304" font-size="9" fill="#6d6478" /></g><g transform="translate(795,100) scale(1.18)"><text x="40" y="20" font-size="12" fill="#7a2cb0">C / 左側板　220 × 82 × 9 mm</text><rect x="40" y="35" width="220" height="82" fill="#d9b789" stroke="#795f41" stroke-width="1.2" /><circle cx="110" cy="76" r="22.5" fill="#fdfbff" stroke="#7a2cb0" stroke-width="1.2" /><path d="M106,76h8 m-4,-4v8" stroke="#b6a2c5" stroke-width=".6" /><circle cx="190" cy="76" r="22.5" fill="#fdfbff" stroke="#7a2cb0" stroke-width="1.2" /><path d="M186,76h8 m-4,-4v8" stroke="#b6a2c5" stroke-width=".6" /><text x="150.0" y="135" text-anchor="middle" font-size="11" fill="#5c436e">220 mm</text><text x="29" y="76.0" text-anchor="middle" font-size="10" fill="#5c436e" transform="rotate(-90 29 76.0)">82 mm</text><text x="40" y="289" font-size="9" fill="#6d6478">雙孔通風，增加空氣流通。</text><text x="40" y="304" font-size="9" fill="#6d6478">通風孔：距後緣 70、150；距下緣 41</text></g><g transform="translate(15,460) scale(1.18)"><text x="40" y="20" font-size="12" fill="#7a2cb0">D / 右側板　220 × 82 × 9 mm</text><rect x="40" y="35" width="220" height="82" fill="#d9b789" stroke="#795f41" stroke-width="1.2" /><circle cx="80" cy="76" r="22.5" fill="#fdfbff" stroke="#7a2cb0" stroke-width="1.2" /><path d="M76,76h8 m-4,-4v8" stroke="#b6a2c5" stroke-width=".6" /><text x="150.0" y="135" text-anchor="middle" font-size="11" fill="#5c436e">220 mm</text><text x="29" y="76.0" text-anchor="middle" font-size="10" fill="#5c436e" transform="rotate(-90 29 76.0)">82 mm</text><text x="40" y="289" font-size="9" fill="#6d6478">單孔備用穿線，依安裝空間選用。</text><text x="40" y="304" font-size="9" fill="#6d6478">穿線孔：距後緣 40；距下緣 41</text></g><g transform="translate(405,460) scale(1.18)"><text x="40" y="20" font-size="12" fill="#7a2cb0">E / 後板　202 × 82 × 9 mm</text><rect x="40" y="35" width="202" height="82" fill="#d9b789" stroke="#795f41" stroke-width="1.2" /><circle cx="96" cy="76" r="22.5" fill="#fdfbff" stroke="#7a2cb0" stroke-width="1.2" /><path d="M92,76h8 m-4,-4v8" stroke="#b6a2c5" stroke-width=".6" /><text x="141.0" y="135" text-anchor="middle" font-size="11" fill="#5c436e">202 mm</text><text x="29" y="76.0" text-anchor="middle" font-size="10" fill="#5c436e" transform="rotate(-90 29 76.0)">82 mm</text><text x="40" y="289" font-size="9" fill="#6d6478">單孔集中穿線，整理電源與訊號線。</text><text x="40" y="304" font-size="9" fill="#6d6478">穿線孔：外視圖左緣 56；距下緣 41</text></g><g transform="translate(795,460) scale(1.18)"><text x="40" y="20" font-size="12" fill="#7a2cb0">F / 前門　198 × 78 × 9 mm</text><rect x="40" y="35" width="198" height="78" fill="#d9b789" stroke="#795f41" stroke-width="1.2" /><text x="139.0" y="131" text-anchor="middle" font-size="11" fill="#5c436e">198 mm</text><text x="29" y="74.0" text-anchor="middle" font-size="10" fill="#5c436e" transform="rotate(-90 29 74.0)">78 mm</text><text x="40" y="289" font-size="9" fill="#6d6478">開門操作電源，方便日常維護。</text><text x="40" y="304" font-size="9" fill="#6d6478" /></g><text x="45" y="864" font-size="14">側板左緣為後緣；後板為外側視圖；孔位為孔心尺寸。圓孔均 Ø45 mm。</text><text x="45" y="891" font-size="14">平接＋內側木條固定；前門四邊各留 2 mm；五金、散熱與實機尺寸確認後加工。</text></g></svg>